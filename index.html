<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#123C32">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Çınaraltı Yol — İzlemekten yaşamaya. Çınaraltı'nın sohbetlerini, eğitimlerini ve içeriklerini kendi yolculuğuna dönüştür.">
  <title>Çınaraltı Yol — İzlemekten Yaşamaya</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

  <!-- App Styles -->
  <link rel="stylesheet" href="style.css">

  <!-- Favicon (inline SVG) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌳</text></svg>">
</head>
<body>

  <!-- Desktop Frame Wrapper -->
  <div id="desktop-frame">
    <div id="desktop-label">ÇINARALTI YOL — INTERACTIVE DEMO</div>
    <div id="phone-container">

      <!-- App Root -->
      <div id="app-root">

        <!-- Splash Screen -->
        <div class="splash-screen" id="splash">
          <img src="assets/logo.svg" alt="Çınaraltı Yol Logo" class="splash-logo">
          <div class="splash-title">ÇINARALTI YOL</div>
          <div class="splash-tagline">İlimden hayata…</div>
        </div>

        <!-- Onboarding -->
        <div id="onboarding"></div>

        <!-- Toast Container -->
        <div class="toast-container" id="toast-container"></div>

        <!-- Main App -->
        <div class="main-app">
          <!-- Screen Content (dynamically rendered) -->
          <div class="screen-content" id="screen-content"></div>

          <!-- Bottom Navigation -->
          <nav class="bottom-nav" aria-label="Ana Navigasyon" style="display:none">
            <button class="nav-item active" aria-label="Bugün">
              <i data-lucide="home"></i>
              <span>Bugün</span>
            </button>
            <button class="nav-item" aria-label="Keşfet">
              <i data-lucide="compass"></i>
              <span>Keşfet</span>
            </button>
            <button class="nav-item" aria-label="Yolculuk">
              <i data-lucide="route"></i>
              <span>Yolculuk</span>
            </button>
            <button class="nav-item" aria-label="Topluluk">
              <i data-lucide="users"></i>
              <span>Topluluk</span>
            </button>
            <button class="nav-item" aria-label="Ben">
              <i data-lucide="user"></i>
              <span>Ben</span>
            </button>
          </nav>
        </div>

      </div>
      <!-- /App Root -->

    </div>
    <!-- /Phone Container -->
  </div>
  <!-- /Desktop Frame -->

  <!-- App Script -->
  <script src="app.js"></script>

</body>
</html>
